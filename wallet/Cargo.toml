[package]
name = "vouch-wallet"
description = "A wallet an AI agent can spend from but can't empty: it reads Vouch and applies the owner's limits on-chain"
version = "0.1.0"
edition = "2024"
resolver = "3"
rust-version = "1.93"
repository = "https://github.com/Oduwal/Vouch"

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
near-sdk = "5.29"

[dev-dependencies]
near-sdk = { version = "5.29", features = ["unit-testing"] }

[profile.release]
codegen-units = 1
opt-level = "z"
lto = true
debug = false
panic = "abort"
overflow-checks = true

[lints.rust.unexpected_cfgs]
level = "warn"
check-cfg = ['cfg(near)']
